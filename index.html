<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Fardos - Turno</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: auto; background: #f9f9f9; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { padding: 12px; font-size: 16px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border-radius: 5px; }
        input { border: 1px solid #ccc; }
        button.add { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.clear { background: #dc3545; color: white; border: none; cursor: pointer; }
        .results { background: #e9ecef; padding: 10px 15px; border-radius: 5px; font-size: 16px; margin-bottom: 15px; }
        .results span { font-weight: bold; color: #333; }
        ul { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; margin: 0; }
        li { background: #f1f3f5; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; }
        .actions button { padding: 5px 10px; font-size: 13px; width: auto; margin-left: 5px; cursor: pointer; }
        .btn-edit { background: #ffc107; border: none; border-radius: 3px; }
        .btn-del { background: #6c757d; color: white; border: none; border-radius: 3px; }
    </style>
</head>
<body>
    <h2>Controle de Fardos de Algodão</h2>
    
    <div class="card">
        <label>Número do Fardo:</label>
        <input type="number" id="numFardo" placeholder="Ex: 8490">
        
        <label>Peso (Kg):</label>
        <input type="number" id="pesoInput" placeholder="Ex: 245.0" step="0.01">
        
        <button class="add" onclick="salvarFardo()">Adicionar / Atualizar Fardo</button>
    </div>

    <div class="results">
        <p>Qtd. Fardos: <span id="qtd">0</span></p>
        <p>Peso Total: <span id="total">0.00</span> kg</p>
        <p>Média: <span id="media">0.00</span> kg</p>
    </div>

    <div class="card">
        <h3>Histórico do Turno</h3>
        <ul id="listaFardos"></ul>
    </div>

    <button class="clear" onclick="limparTurno()">Zerar Turno Completo</button>

    <script>
        let fardos = [];
        let editandoIndex = null; // Guarda se estamos editando um fardo existente

        function salvarFardo() {
            const inputNum = document.getElementById('numFardo');
            const inputPeso = document.getElementById('pesoInput');
            
            const numero = inputNum.value.trim();
            const peso = parseFloat(inputPeso.value.replace(',', '.'));

            if (!numero || isNaN(peso) || peso <= 0) {
                alert("Preencha a numeração e o peso corretamente!");
                return;
            }

            if (editandoIndex !== null) {
                // Editando fardo existente
                fardos[editandoIndex] = { numero, peso };
                editandoIndex = null;
                document.querySelector('.add').innerText = "Adicionar Fardo";
            } else {
                // Adicionando novo fardo
                fardos.push({ numero, peso });
            }

            inputNum.value = '';
            inputPeso.value = '';
            inputNum.focus();
            atualizarTela();
        }

        function atualizarTela() {
            const qtd = fardos.length;
            const total = fardos.reduce((acc, val) => acc + val.peso, 0);
            const media = qtd > 0 ? total / qtd : 0;

            document.getElementById('qtd').innerText = qtd;
            document.getElementById('total').innerText = total.toFixed(2);
            document.getElementById('media').innerText = media.toFixed(2);

            const lista = document.getElementById('listaFardos');
            lista.innerHTML = '';

            fardos.forEach((fardo, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>Fardo Nº: ${fardo.numero} - ${fardo.peso}Kg</span>
                    <div class="actions">
                        <button class="btn-edit" onclick="prepararEdicao(${index})">Editar</button>
                        <button class="btn-del" onclick="removerFardo(${index})">Excluir</button>
                    </div>
                `;
                lista.appendChild(li);
            });
        }

        function prepararEdicao(index) {
            document.getElementById('numFardo').value = fardos[index].numero;
            document.getElementById('pesoInput').value = fardos[index].peso;
            editandoIndex = index;
            document.querySelector('.add').innerText = "Atualizar Fardo";
            document.getElementById('pesoInput').focus();
        }

        function removerFardo(index) {
            if (confirm("Deseja remover este fardo?")) {
                fardos.splice(index, 1);
                if (editandoIndex === index) editandoIndex = null;
                atualizarTela();
            }
        }

        function limparTurno() {
            if(confirm("Tem certeza que deseja zerar todos os fardos do turno?")) {
                fardos = [];
                editandoIndex = null;
                atualizarTela();
            }
        }
    </script>
</body>
</html>
